name: nightly
# Mutation testing over the deny paths with a zero-survivor gate (AMENDMENTS-01 §15). Nightly
# because it rebuilds and re-tests once per mutant. One more job, `loaded-repeat`, repeats
# RT-AG-09's bombs binary beside a full `make test` (#141); it reports and does not gate (below).
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
# A running nightly always finishes: a new run waits instead of cancelling it (two runs were
# lost that way). GitHub still keeps only one pending run per group.
concurrency:
  group: nightly
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_MUTANTS_VERSION: "27.1.0"
  # Mutants run their tests under nextest (#82); the same pin as ci.yml.
  CARGO_NEXTEST_VERSION: "0.9.151"
# Every mutation set runs in round-robin shards, each sized to finish within about two-thirds of
# its job's limit; a set that outgrows that gets more shards, never fewer mutants.
# scripts/nightly-shards.sh (in `make test-scripts`) fails when a set's rows do not list every
# shard once. Measured in run 45048224610 (22 Nov 2026), mutant phase of the slowest shard, about
# 7 minutes of setup on top: the deny paths 553 mutants, 71 minutes unsharded, 36 at 2 shards.
jobs:
  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: 0/2 }
          - { shard: 1/2 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Shards have died with "The operation was canceled" and no artifact (#82): print what the
      # runner has before and after, and free the same unused SDKs the rust job removes.
      - name: runner disk and memory (start)
        run: df -h / && free -m
      - name: free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - run: cargo install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION"
      - name: verify cargo-mutants version
        run: cargo mutants --version | grep -Fw "$CARGO_MUTANTS_VERSION"
      - run: cargo install cargo-nextest --locked --version "$CARGO_NEXTEST_VERSION"
      - name: verify cargo-nextest version
        run: cargo nextest --version | grep -Fw "$CARGO_NEXTEST_VERSION"
      - name: mutants (deny paths ${{ matrix.shard }})
        env:
          SHARD: ${{ matrix.shard }}
        run: make mutants MUTANTS_SHARD="$SHARD"
      - name: runner disk and memory (end)
        if: always()
        run: df -h / && free -m && du -sh target 2>/dev/null || true
      # Named by the matrix row index, which here is the shard's k (a shard name holds a `/`).
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out-${{ strategy.job-index }}
          path: mutants.out/
          if-no-files-found: ignore
  # The wider scope (CLAUDE.md "Mutation scope"), zero survivors too. Only container-free tests
  # run per mutant, so no podman is needed. Each mutant rebuilds the crate and reruns its whole
  # test set. Sized as the deny paths are (above), from run 45048224610: core 1619 mutants, 204
  # minutes of work, its slowest shard about 39 minutes at 6 shards (both of its 2 shards hit the
  # 90-minute limit); sallyd 3746 mutants, 2044 minutes, about 68 at 36 shards (117 at 24); cli 21
  # and shim 2 unsharded. The counts leave room for the round-robin split to shift by a third as
  # mutants are added. Mutant TIMEOUTs (#82) need the 150-minute sallyd limit. Some shards queue
  # behind the concurrent-job limit; that is fine for a nightly. Tests run under nextest's
  # `mutants` profile, whose 30 s per-test limit ends a hung test long before the whole-mutant
  # timeout (#82).
  mutants-wide:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.set == 'sallyd' && 150 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { set: core, shard: 0/6 }
          - { set: core, shard: 1/6 }
          - { set: core, shard: 2/6 }
          - { set: core, shard: 3/6 }
          - { set: core, shard: 4/6 }
          - { set: core, shard: 5/6 }
          - { set: sallyd, shard: 0/36 }
          - { set: sallyd, shard: 1/36 }
          - { set: sallyd, shard: 2/36 }
          - { set: sallyd, shard: 3/36 }
          - { set: sallyd, shard: 4/36 }
          - { set: sallyd, shard: 5/36 }
          - { set: sallyd, shard: 6/36 }
          - { set: sallyd, shard: 7/36 }
          - { set: sallyd, shard: 8/36 }
          - { set: sallyd, shard: 9/36 }
          - { set: sallyd, shard: 10/36 }
          - { set: sallyd, shard: 11/36 }
          - { set: sallyd, shard: 12/36 }
          - { set: sallyd, shard: 13/36 }
          - { set: sallyd, shard: 14/36 }
          - { set: sallyd, shard: 15/36 }
          - { set: sallyd, shard: 16/36 }
          - { set: sallyd, shard: 17/36 }
          - { set: sallyd, shard: 18/36 }
          - { set: sallyd, shard: 19/36 }
          - { set: sallyd, shard: 20/36 }
          - { set: sallyd, shard: 21/36 }
          - { set: sallyd, shard: 22/36 }
          - { set: sallyd, shard: 23/36 }
          - { set: sallyd, shard: 24/36 }
          - { set: sallyd, shard: 25/36 }
          - { set: sallyd, shard: 26/36 }
          - { set: sallyd, shard: 27/36 }
          - { set: sallyd, shard: 28/36 }
          - { set: sallyd, shard: 29/36 }
          - { set: sallyd, shard: 30/36 }
          - { set: sallyd, shard: 31/36 }
          - { set: sallyd, shard: 32/36 }
          - { set: sallyd, shard: 33/36 }
          - { set: sallyd, shard: 34/36 }
          - { set: sallyd, shard: 35/36 }
          - { set: shim, shard: 0/1 }
          - { set: cli, shard: 0/1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As in the mutants job (#82).
      - name: runner disk and memory (start)
        run: df -h / && free -m
      - name: free runner disk
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - run: cargo install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION"
      - name: verify cargo-mutants version
        run: cargo mutants --version | grep -Fw "$CARGO_MUTANTS_VERSION"
      - run: cargo install cargo-nextest --locked --version "$CARGO_NEXTEST_VERSION"
      - name: verify cargo-nextest version
        run: cargo nextest --version | grep -Fw "$CARGO_NEXTEST_VERSION"
      - name: mutants (${{ matrix.set }} ${{ matrix.shard }})
        env:
          SET: ${{ matrix.set }}
          SHARD: ${{ matrix.shard }}
        run: make "mutants-wide-$SET" MUTANTS_SHARD="$SHARD" MUTANTS_OUT=target/mutants-wide
      - name: runner disk and memory (end)
        if: always()
        run: df -h / && free -m && du -sh target 2>/dev/null || true
      # The suffix is the matrix row index, not the shard's k: sallyd shard k is
      # mutants-wide-sallyd-<k+6>, after core's six rows.
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-wide-${{ matrix.set }}-${{ strategy.job-index }}
          path: target/mutants-wide/mutants.out/
          if-no-files-found: ignore
  # RT-AG-09's bombs binary under load (#141): 10 repeats beside one `make test` pass, none
  # started later than 15 minutes after the first, each at most 5 minutes (`make loaded-repeat`,
  # scripts/loaded-repeat.sh). It reports and does not gate: the job fails on a red repeat or on
  # fewer than 10 loaded repeats, and its continue-on-error keeps that out of the run's
  # conclusion, which stays the mutation verdict. No job needs it, and only this job may carry
  # continue-on-error (scripts/nightly-shards.sh). Its own result:
  # gh run view <id> --json jobs --jq '.jobs[] | select(.name == "loaded-repeat") | .conclusion'
  loaded-repeat:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The container tests' disk, prerequisites and base image, as in ci.yml's rust job.
      - name: free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - name: container test prerequisites
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends gnutls-bin golang-go
          certtool --version | head -n1
          command -v go && go version
          openssl version
          python3 --version
          podman --version
          cc --version | head -n1
          strace -V | head -n1
          test -n "$XDG_RUNTIME_DIR"
          podman info --format '{{.Host.CgroupsVersion}} {{.Host.OCIRuntime.Path}}'
          podman pull docker.io/library/alpine@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
      - name: runner cores and memory
        run: nproc && free -m
      - run: cargo test -q --locked --workspace --no-run
      - name: disk space for container launches
        run: scripts/disk-check.sh target "$(podman info --format '{{.Store.GraphRoot}}')"
      - run: make loaded-repeat LOADED_REPEATS=10 LOADED_REPEAT_RESTART=0 LOADED_REPEAT_START_LIMIT=900 LOADED_REPEAT_LIMIT=300
      - name: results to the job summary
        if: always()
        run: |
          for f in target/loaded-repeat/*/results.txt; do
            [ -f "$f" ] || continue
            { echo '```'; cat "$f"; echo '```'; } >>"$GITHUB_STEP_SUMMARY"
          done
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: loaded-repeat
          path: target/loaded-repeat/
          if-no-files-found: ignore
