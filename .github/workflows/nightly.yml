name: nightly
# Mutation testing over the deny paths with a zero-survivor gate (AMENDMENTS-01 §15). Nightly
# because it rebuilds and re-tests once per mutant.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
# A running nightly always finishes: a new run waits instead of cancelling it (two runs were
# lost that way). GitHub still keeps only one pending run per group.
concurrency:
  group: nightly
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_MUTANTS_VERSION: "27.1.0"
jobs:
  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION"
      - name: verify cargo-mutants version
        run: cargo mutants --version | grep -Fw "$CARGO_MUTANTS_VERSION"
      - run: make mutants
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out
          path: mutants.out/
          if-no-files-found: ignore
  # The wider scope (CLAUDE.md "Mutation scope"), zero survivors too. Only container-free tests
  # run per mutant, so no podman is needed. Each mutant rebuilds the crate and reruns its whole
  # test set, about 27 s per mutant on these runners (#79), so the sallyd count sets the shards:
  # 24 keeps each one near 45 minutes; mutant TIMEOUTs (#82) need the 150-minute sallyd limit. Some
  # shards queue behind the concurrent-job limit; that is fine for a nightly.
  mutants-wide:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.set == 'sallyd' && 150 || 90 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { set: core, shard: 0/2 }
          - { set: core, shard: 1/2 }
          - { set: sallyd, shard: 0/24 }
          - { set: sallyd, shard: 1/24 }
          - { set: sallyd, shard: 2/24 }
          - { set: sallyd, shard: 3/24 }
          - { set: sallyd, shard: 4/24 }
          - { set: sallyd, shard: 5/24 }
          - { set: sallyd, shard: 6/24 }
          - { set: sallyd, shard: 7/24 }
          - { set: sallyd, shard: 8/24 }
          - { set: sallyd, shard: 9/24 }
          - { set: sallyd, shard: 10/24 }
          - { set: sallyd, shard: 11/24 }
          - { set: sallyd, shard: 12/24 }
          - { set: sallyd, shard: 13/24 }
          - { set: sallyd, shard: 14/24 }
          - { set: sallyd, shard: 15/24 }
          - { set: sallyd, shard: 16/24 }
          - { set: sallyd, shard: 17/24 }
          - { set: sallyd, shard: 18/24 }
          - { set: sallyd, shard: 19/24 }
          - { set: sallyd, shard: 20/24 }
          - { set: sallyd, shard: 21/24 }
          - { set: sallyd, shard: 22/24 }
          - { set: sallyd, shard: 23/24 }
          - { set: shim, shard: 0/1 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION"
      - name: verify cargo-mutants version
        run: cargo mutants --version | grep -Fw "$CARGO_MUTANTS_VERSION"
      - name: mutants (${{ matrix.set }} ${{ matrix.shard }})
        env:
          SET: ${{ matrix.set }}
          SHARD: ${{ matrix.shard }}
        run: make "mutants-wide-$SET" MUTANTS_SHARD="$SHARD" MUTANTS_OUT=target/mutants-wide
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-wide-${{ matrix.set }}-${{ strategy.job-index }}
          path: target/mutants-wide/mutants.out/
          if-no-files-found: ignore
