name: nightly
# Mutation testing over the deny paths with a zero-survivor gate (AMENDMENTS-01 §15). Nightly
# because it rebuilds and re-tests once per mutant.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_MUTANTS_VERSION: "27.1.0"
jobs:
  mutants:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-mutants --locked --version "$CARGO_MUTANTS_VERSION"
      - name: verify cargo-mutants version
        run: cargo mutants --version | grep -Fw "$CARGO_MUTANTS_VERSION"
      - run: make mutants
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-out
          path: mutants.out/
          if-no-files-found: ignore
