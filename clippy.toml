allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-indexing-slicing-in-tests = true
# Every rustix open goes through sally_core::fd, which always adds O_CLOEXEC.
disallowed-methods = [
  { path = "rustix::fs::open", reason = "use sally_core::fd::open (adds O_CLOEXEC)" },
  { path = "rustix::fs::openat", reason = "use sally_core::fd::openat (adds O_CLOEXEC)" },
  { path = "rustix::fs::openat2", reason = "use sally_core::fd::openat2 (adds O_CLOEXEC)" },
]
