[package]
name = "sally-core"
description = "Sallyport: sally-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["fs", "process", "std"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize", "serialize"] }
serde_path_to_error = "0.1.20"
thiserror = "2.0.21"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
zeroize = { version = "1.9.1", default-features = false, features = ["alloc", "serde"] }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
