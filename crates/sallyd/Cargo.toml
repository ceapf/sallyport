[package]
name = "sallyd"
description = "Sallyport: sallyd"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
httparse = "1.10.1"
rustix = { version = "1.1.6", default-features = false, features = ["fs", "process", "std"] }
sally-core = { path = "../sally-core", version = "0.1.0" }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
