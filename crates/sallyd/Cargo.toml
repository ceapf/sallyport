[package]
name = "sallyd"
description = "Sallyport: sallyd"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
# Already in the tree through pem and serde-saphyr: strict canonical decode of fs_write's
# `content_b64` and encode of fs_read results (Task 11; no new crate).
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
httparse = "1.10.1"
# llm.sock: the HTTP/1.1 server (Task 7 decision 7; architect Q10). Task 9a-2 (architect Q32):
# also the client, for HTTP/1.1 inside intercepted tunnels. http1 only; no http2.
http-body-util = "0.1.5"
hyper = { version = "1.12.0", default-features = false, features = ["http1", "client", "server"] }
# TokioIo for hyper on tokio streams (a hand-written adapter would need unsafe).
hyper-util = { version = "0.1.21", default-features = false, features = ["tokio"] }
pem = { version = "4.0.0", default-features = false, features = ["std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "zeroize"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
time = { version = "0.3.55", default-features = false }
# `net`: SO_PEERCRED for the peer-UID check on every broker socket (architect Q1).
# `rand`: getrandom(2) for single-use approval ids (Task 10; no new crate).
rustix = { version = "1.1.6", default-features = false, features = ["fs", "net", "process", "rand", "std"] }
sally-core = { path = "../sally-core", version = "0.1.0" }
# The control socket's wire types, shared with the CLI (architect Q78; a workspace crate).
sally-proto = { path = "../sally-proto", version = "0.1.0" }
# Already in the tree through serde_json; used directly for the duplicate-key-refusing parse.
serde = "1.0.229"
serde_json = "1.0.154"
# Already in the tree through sally-core: the sha256 of llm.sock bodies in audit entries.
sha2 = "0.11.1"
thiserror = "2.0.21"
# `signal`: SIGTERM/SIGINT shutdown (Task 12); signal-hook-registry is already in the tree through
# `process`, so no new crate.
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
# Task 9a-2: TLS termination and re-origination inside intercepted tunnels.
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
# Already in the tree through sally-core: wipes the response bytes the redactor holds back
# (Task 9a-3, architect D2), which may hold part of a secret.
zeroize = { version = "1.9.1", default-features = false, features = ["alloc"] }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
# RT-FS-15 through the CLI's own code against the real control socket (architect Q79).
sally-cli = { path = "../sally-cli", version = "0.1.0" }
sha2 = "0.11.1"
tokio = { version = "1.54.1", default-features = false, features = ["test-util"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
x509-parser = { version = "0.18.1", default-features = false }
