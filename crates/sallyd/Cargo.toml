[package]
name = "sallyd"
description = "Sallyport: sallyd"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
httparse = "1.10.1"
pem = { version = "4.0.0", default-features = false, features = ["std"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring", "zeroize"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = { version = "1.16.0", features = ["std"] }
time = { version = "0.3.55", default-features = false }
rustix = { version = "1.1.6", default-features = false, features = ["fs", "process", "std"] }
sally-core = { path = "../sally-core", version = "0.1.0" }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false, features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }

[dev-dependencies]
insta = "1.49.0"
proptest = "1.12.0"
sha2 = "0.11.1"
tokio = { version = "1.54.1", default-features = false, features = ["test-util"] }
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
x509-parser = { version = "0.18.1", default-features = false }
