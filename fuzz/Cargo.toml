# Fuzz targets (cargo-fuzz). Not a workspace member: libFuzzer needs nightly + sanitizers, the
# workspace builds on pinned stable. CI runs each target for 60 s (see .github/workflows/ci.yml).
[package]
name = "sallyport-fuzz"
version = "0.0.0"
authors = ["The Sallyport Authors"]
edition = "2024"
publish = false
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
# egress_rewrite: the same head parser and header types the proxy gets from hyper.
httparse = "1.10.1"
hyper = { version = "1.12.0", default-features = false }
sally-core = { path = "../crates/sally-core", version = "0.1.0" }
sallyd = { path = "../crates/sallyd", version = "0.1.0" }
# Already in the tree through sallyd; builds the tool arguments object for `tool_args`.
serde_json = "1.0.154"

# Detach from the root workspace.
[workspace]

[[bin]]
name = "manifest"
path = "fuzz_targets/manifest.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secrets"
path = "fuzz_targets/secrets.rs"
test = false
doc = false
bench = false

[[bin]]
name = "egress_head"
path = "fuzz_targets/egress_head.rs"
test = false
doc = false
bench = false

[[bin]]
name = "audit_line"
path = "fuzz_targets/audit_line.rs"
test = false
doc = false
bench = false

[[bin]]
name = "jsonrpc_message"
path = "fuzz_targets/jsonrpc_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "llm_request"
path = "fuzz_targets/llm_request.rs"
test = false
doc = false
bench = false

[[bin]]
name = "egress_rewrite"
path = "fuzz_targets/egress_rewrite.rs"
test = false
